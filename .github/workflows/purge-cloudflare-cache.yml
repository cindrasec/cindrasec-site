# Purge the Cloudflare edge cache after GitHub Pages has finished deploying.
#
# WHY THIS TRIGGERS ON workflow_run AND NOT ON push
# -------------------------------------------------
# Pages deploys asynchronously. A purge fired on `push` races the deploy and
# usually loses: Cloudflare drops the cached copy, the next visitor's request
# reaches an origin that is still serving the PREVIOUS build, and that stale
# response is what gets cached — now with a fresh TTL. The purge would make
# staleness *worse* and look like it had worked.
#
# WHY deployment_status AND NOT workflow_run
# ------------------------------------------
# This first shipped as `workflow_run: workflows: ["pages build and deployment"]`
# and never fired once. That trigger only matches workflows defined by a file in
# this repository's .github/workflows directory. GitHub's Pages build is not one
# — it is generated by GitHub and reports with event `dynamic` and path
# `dynamic/pages/pages-build-deployment` — so the name matched nothing and the
# workflow sat there looking configured. Two deploys completed under it with no
# purge, which is exactly the failure mode the file's own comments warn about:
# something that appears to have worked.
#
# `deployment_status` does fire for Pages, once per state change, and carries the
# environment and the success/failure state. Waiting for state == 'success' means
# the origin is already serving the new bytes before anything is purged.
#
# WHAT THIS DOES NOT FIX
# ----------------------
# A visitor's own service worker (sw.js) caches independently of Cloudflare, and
# a purge here does nothing to it. That is still governed by CACHE_NAME, which
# still has to be bumped on any deploy that changes a network-first asset. Two
# separate caches, two separate disciplines — see the comment at the top of
# sw.js for why the second one exists.

name: Purge Cloudflare cache

on:
  deployment_status:
  # Manual trigger, for when the edge is serving something stale and you want it
  # gone without pushing an empty commit to force a deploy.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    # The job runs on every deployment_status event and decides inside the step,
    # rather than filtering here with `if:`. A job skipped by `if:` produces no
    # log, so when the condition is wrong there is nothing to read and the
    # workflow is indistinguishable from one that is working — which is how the
    # previous `workflow_run` mistake survived two deploys unnoticed. Deciding in
    # the step costs a few seconds of runner time and leaves a record of what the
    # event actually contained.
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployment state
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          STATE: ${{ github.event.deployment_status.state }}
          ENVIRONMENT: ${{ github.event.deployment_status.environment }}
          DEPLOY_ENV: ${{ github.event.deployment.environment }}
          REF: ${{ github.event.deployment.ref }}
        run: |
          echo "event=${EVENT} state=${STATE} environment=${ENVIRONMENT} deployment.environment=${DEPLOY_ENV} ref=${REF}"

          # A manual dispatch is always deliberate.
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Only after a deploy that actually succeeded. deployment_status also
          # fires for queued and in_progress; purging on those would reintroduce
          # the mid-deploy race this workflow exists to avoid, and a purge after
          # a failed build would evict good content and repopulate it from an
          # origin that never changed.
          if [ "${STATE}" != "success" ]; then
            echo "::notice::state=${STATE}, not a completed deploy — nothing to purge."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Purge
        if: steps.gate.outputs.proceed == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail

          # Skip rather than fail when the secrets are not configured. A red X
          # on every push would train the eye to ignore this workflow, which is
          # the opposite of what a deploy check is for.
          if [ -z "${CF_API_TOKEN}" ] || [ -z "${CF_ZONE_ID}" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ZONE_ID not set — skipping purge."
            echo "Set both under Settings → Secrets and variables → Actions to enable it."
            exit 0
          fi

          response=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          # Cloudflare answers 200 with {"success":false} on a permission or
          # zone-id error, so the HTTP status alone proves nothing.
          if printf '%s' "$response" | grep -q '"success":true'; then
            echo "Cache purged."
          else
            echo "::error::Purge failed. Cloudflare said:"
            printf '%s\n' "$response"
            exit 1
          fi
