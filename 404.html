<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Nothing found in scope · Cindrasec</title>
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'unsafe-inline'; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com; font-src 'self'; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; base-uri 'self'; object-src 'none'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- Google Analytics 4, same bootstrap as every other page. This page was the
     one exception, which made the privacy notice's "runs on every page" untrue
     and left broken inbound links invisible — the 404 is the only place they
     show up. GA records page_location as the URL that was actually requested,
     so a missing path is reported as itself, while page_title is identical for
     every 404 and makes them one filterable group in reports.

     connect-src deliberately omits api.web3forms.com: there is no form here,
     and this page renders at attacker-chosen URLs, so it gets the analytics
     origins and nothing else. style-src keeps 'unsafe-inline' for the reason
     documented in _headers — the CSS is inline so an error page costs exactly
     one request no matter which missing URL produced it. -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-G55N8ZL68Z"></script>
<script src="/analytics.js" defer></script>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<style>
  /* self-hosted fonts — absolute paths because this page renders at any missing URL */
  @font-face{ font-family:'Inter'; font-style:normal; font-weight:100 900; font-display:swap; src:url('/fonts/inter-var.woff2') format('woff2'); }
  @font-face{ font-family:'JetBrains Mono'; font-style:normal; font-weight:100 800; font-display:swap; src:url('/fonts/jetbrains-mono-var.woff2') format('woff2'); }
  @font-face{ font-family:'Space Grotesk'; font-style:normal; font-weight:300 700; font-display:swap; src:url('/fonts/space-grotesk-var.woff2') format('woff2'); }
  :root{ --ink:#0F1217; --ink-2:#171B21; --cream:#F4F1EA; --ember-1:#FFC169; --ember-2:#FF5A36; --cyan:#33E0C8; --muted:#9AA0A8; --line:rgba(244,241,234,.09); }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center; background:var(--ink); color:var(--cream); font-family:'Inter',system-ui,sans-serif; text-align:center; padding:24px; }
  .wrap{ max-width:480px; }
  .code{ font-family:'JetBrains Mono',monospace; color:var(--cyan); font-size:14px; letter-spacing:.1em; margin-bottom:18px; }
  h1{ font-family:'Space Grotesk',sans-serif; font-size:clamp(28px,5vw,40px); margin:0 0 14px; }
  h1 .grad{ background:linear-gradient(90deg,var(--ember-1),var(--ember-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p{ color:var(--muted); font-size:15.5px; line-height:1.6; margin-bottom:32px; }
  a.btn{ display:inline-flex; align-items:center; gap:8px; padding:13px 22px; border-radius:999px; background:linear-gradient(135deg,var(--ember-1),var(--ember-2) 60%,#C2361A); color:#1A0D07; font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:600; text-decoration:none; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">scan complete — 0 assets found · out of scope</div>
    <h1>This page isn't in <span class="grad">scope.</span></h1>
    <p>The page you're looking for doesn't exist, or the link is out of date. Everything else on the site is right where it should be.</p>
    <a class="btn" href="/">Back to Cindrasec →</a>
  </div>
</body>
</html>
